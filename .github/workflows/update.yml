name: update

# 每天从上游 cainiao524/acl4ssr-steam 拉底板 + 应用自家 patch，
# 重新生成 ACL4SSR_Online_Full_ClaudeAI_MultiMode.ini。
#
# 做法与 acl4ssr-steam 自己维护游戏分流的方式一致：
# 产物在仓库里，但只由脚本生成，改动永远可追溯到 build.py 里的 patch。

on:
  schedule:
    # UTC 04:00 = 北京时间 12:00，避开 GitHub 的整点高峰
    - cron: "0 4 * * *"
  workflow_dispatch:        # 允许手动触发
  push:
    branches: [main]
    paths:                  # patch 变了就立刻重建，不用等到第二天
      - build.py
      - .github/workflows/update.yml

permissions:
  contents: write           # 需要提交产物

concurrency:
  # ⚠️ 这个组名必须和 fleet.yml 里的【一模一样】—— 见那边的注释。
  # 两条工作流都往 main 推提交，同名才能互相排队；否则会撞成
  # "Commit if changed 失败"（构建全绿、只有推送被拒，最容易误判）。
  group: main-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 推送前要先把远端合进来，需要完整历史（默认 fetch-depth: 1 是浅克隆，
          # 浅克隆下 merge 会因为找不到共同祖先而失败）
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # setup-python 带的是纯净解释器，PyYAML 不是标准库 ——
      # 后面的 "Validate base" 步骤要解析 YAML，先装上。
      - name: Install deps
        run: python -m pip install --quiet pyyaml

      - name: Generate
        run: python build.py --report

      - name: Sanity check
        run: |
          set -euo pipefail
          OUT=ACL4SSR_Online_Full_ClaudeAI_MultiMode.ini
          test -s "$OUT" || { echo "::error::产物为空"; exit 1; }

          # 关键断言：patch 必须真的生效了。
          # 只检查「文件生成成功」是不够的 —— 上游一旦改结构，build.py 会退化成
          # 原样输出（或被锚点检查拦住），产物看着正常但其实一条 patch 都没打上。
          grep -q 'custom_proxy_group=🔒 AI 专用`select`' "$OUT" \
            || { echo "::error::「🔒 AI 专用」组缺失"; exit 1; }
          grep -q 'custom_proxy_group=💬 Ai平台`select`\[\]🔒 AI 专用`\[\]🚀 手动切换$' "$OUT" \
            || { echo "::error::「💬 Ai平台」组未按要求替换"; exit 1; }

          AI_GRP=$(grep 'custom_proxy_group=💬 Ai平台`' "$OUT")
          for bad in 自动选择 故障转移 负载均衡 DIRECT; do
            case "$AI_GRP" in
              *"$bad"*) echo "::error::「💬 Ai平台」仍含 $bad"; exit 1 ;;
            esac
          done

          # 新规则集必须在 ProxyGFWlist 之前（先匹配者胜）
          AI_LINE=$(grep -n 'ai-proxy-rules.*surge/anthropic' "$OUT" | head -1 | cut -d: -f1)
          GFW_LINE=$(grep -n 'ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR' "$OUT" | head -1 | cut -d: -f1)
          test -n "$AI_LINE" || { echo "::error::找不到新增的 anthropic 规则集"; exit 1; }
          test -n "$GFW_LINE" || { echo "::error::找不到 ProxyGFWlist 规则集"; exit 1; }
          test "$AI_LINE" -lt "$GFW_LINE" \
            || { echo "::error::新 AI 规则集排在 ProxyGFWlist 之后（会被抢先命中）"; exit 1; }

          # clash_rule_base 必须被激活（DNS / sniffer / ipv6 都在那个文件里）
          grep -q '^clash_rule_base=https://raw.githubusercontent.com/cainiao524/acl4ssr-ai/main/base/clash-base.yaml$' "$OUT" \
            || { echo "::error::clash_rule_base 未激活 —— DNS 会退化成 subconverter 内建模板（无 dns 段）"; exit 1; }
          # 它必须是【未注释】的那一行，不能只是把注释掉的默认值留着
          if grep -q '^;clash_rule_base=' "$OUT"; then
            echo "::error::仍存在被注释的 clash_rule_base，patch 可能没生效"; exit 1
          fi

          echo "自检通过：AI 组已钉死，规则集位置正确，clash_rule_base 已激活"

      # ── 自建节点【不能】被"写死名字"引用 ────────────────────────────────
      # 真实事故（FlClash 拒绝加载整份配置）：
      #     proxy group[3]: 日本节点: '🇯🇵 日本 [SELF] xtls-reality' not found
      # 原因：转换站 append_type=true 会给节点名插协议前缀，实际产出的是
      #     🇯🇵 [VLESS] 日本 [SELF] xtls-reality
      # 而改名【只作用于节点名，不作用于组里写死的 `[]名字`】→ 引用悬空。
      # 对照：「🔒 AI 专用」用的是过滤器 `[[]SELF[]]`，所以它一直正常。
      #
      # 这就是当时缺的那一道断言：以前只验"AI 组在不在"，
      # 没人验"组里的成员名在不在节点表里"，坏配置就一路发到了客户端。
      # 用 Python 而不是 grep：这些字符串里全是反引号/方括号，
      # 在 bash 里要套三层转义，很容易写出"看着对其实没匹配上"的假断言。
      - name: Assert groups do not hardcode self-hosted node names
        run: |
          python - <<'PY'
          import pathlib, sys

          BT = "`"
          REALITY = r"(\[SELF\].*xtls-reality)"
          HYST = r"(\[SELF\].*hysteria2)"
          JAPAN = r"(日本|🇯🇵|Japan|JP)"
          SELF_ONLY = "[[]SELF[]]"
          AIRPORT_REGIONS = ["🇭🇰 香港节点", "🇨🇳 台湾节点", "🇸🇬 狮城节点",
                             "🇺🇲 美国节点", "🇰🇷 韩国节点"]
          # 机场日本节点：靠命名形态区分（自建是「日本 」，机场不是）。
          # 前瞻在这个引擎上静默匹配 0 个，所以不能用否定前瞻。
          JAPAN_AIRPORT = r"(日本[^\s])"
          AI_PRIORITY = ("https://raw.githubusercontent.com/cainiao524/acl4ssr-ai/main/"
                         "base/ai-priority.list")

          text = pathlib.Path("ACL4SSR_Online_Full_ClaudeAI_MultiMode.ini").read_text(encoding="utf-8")
          groups = {}
          for line in text.splitlines():
              if not line.startswith("custom_proxy_group="):
                  continue
              # 行格式：custom_proxy_group=名`类型`成员`成员…
              name, _, rest = line.split("=", 1)[1].partition(BT)
              groups[name] = rest.split(BT)

          # 前瞻在这个转换站（subconverter-ng）上【静默匹配 0 个节点】，
          # 然后 select 组退化成 [DIRECT] —— 配置能加载、看着正常，整组却废了。
          # 官方 README 里明确写着前瞻可用（`(^(?!.*(美国|日本)).*)`），
          # 所以这件事只能靠断言拦，不能靠文档推断。
          # 实测记录：`(^(?!.*\[SELF\]).*)` 与 `(^(?!.*SELF).*)` 都是 0 个。
          for name, parts in groups.items():
              for m in parts:
                  if "(?!" in m:
                      print("::error::「%s」用了前瞻 %r —— subconverter-ng 不支持，会静默匹配 0 个" % (name, m))
                      sys.exit(1)

          bad = [(n, m) for n, parts in groups.items() for m in parts[1:]
                 if m.startswith("[]") and "[SELF]" in m]
          if bad:
              for name, member in bad:
                  print("::error::「%s」写死了自建节点名 %r —— 转换站改名后会悬空，改用过滤器"
                        % (name, member))
              sys.exit(1)

          for g in ("♻️ 自动选择", "🔯 故障转移", "🔮 负载均衡"):
              if groups.get(g) != ["select", REALITY]:
                  print("::error::「%s」必须钉死为 select + %s，实际 %r" % (g, REALITY, groups.get(g)))
                  sys.exit(1)

          # 「🇯🇵 日本节点」必须【同时】满足两件方向相反的事，缺一个都是缺陷：
          #   ① 机场日本节点在里面 —— 它是地区组，另外 13 个组引用它；
          #      只有自建 2 个 = 组名叫「日本节点」却没有一个机场日本节点。
          #   ② 机场节点排在自建【之后】—— select 首位即默认出口，
          #      排前面就漂到机场了（账号风险）。
          japan = groups.get("🇯🇵 日本节点")
          if japan != ["select", REALITY, HYST, JAPAN]:
              print("::error::「🇯🇵 日本节点」必须是 [自建Reality, 自建Hysteria2, 机场日本]，实际 %r"
                    % (japan,))
              sys.exit(1)

          # 自建 / 机场 两个显式入口
          if groups.get("🚀 自建节点") != ["select", SELF_ONLY]:
              print("::error::「🚀 自建节点」必须是 select + %s，实际 %r"
                    % (SELF_ONLY, groups.get("🚀 自建节点")))
              sys.exit(1)
          want_airport = (["select"] + ["[]" + g for g in AIRPORT_REGIONS]
                          + [JAPAN_AIRPORT])
          if groups.get("✈️ 机场节点") != want_airport:
              print("::error::「✈️ 机场节点」必须引用只含机场节点的地区组 %r，实际 %r"
                    % (want_airport, groups.get("✈️ 机场节点")))
              sys.exit(1)
          # 两个入口都是【手动】用的，不能被任何组引用
          #（否则其中一个空掉时，引用它的那条链路会一起出错）
          for g in ("🚀 自建节点", "✈️ 机场节点"):
              users = [n for n, parts in groups.items() if ("[]" + g) in parts]
              if users:
                  print("::error::「%s」被 %r 引用了 —— 它是手动入口，空组时会连带出错" % (g, users))
                  sys.exit(1)
          if "[]🇯🇵 日本节点" in groups.get("✈️ 机场节点", []):
              print("::error::「✈️ 机场节点」引用了「🇯🇵 日本节点」—— 那个组含自建节点，不再是机场入口")
              sys.exit(1)

          # 「AI 优先关键字」必须插在微软规则集【之前】。
          # 为什么：OpenAI 有一批资产和实时通道跑在微软/Azure 的主机名上 ——
          #   openaiapi-site.azureedge.net / *.blob.core.windows.net
          #   production-openaicom-storage.azureedge.net
          #   chatgpt-async-webps-prod-*.webpubsub.azure.com（实时/语音信令）
          # 微软规则集（Microsoft.list → azure.com / windows.net / azureedge.net）
          # 声明在 AI 规则集之前，先匹配者胜 => 这些域先落进「Ⓜ️ 微软服务」，
          # 而那一组首位是 DIRECT，于是走真实 IP 且【毫无报错】。
          # 只插 openai / chatgpt 两条关键字把那几个域拉回 AI 组，
          # 微软其余流量（Windows Update / Office / Teams）保持直连。
          raw_lines = text.splitlines()
          pri_idx = [i for i, l in enumerate(raw_lines)
                     if l.strip() == "ruleset=💬 Ai平台," + AI_PRIORITY]
          ms_idx = [i for i, l in enumerate(raw_lines)
                    if l.strip().startswith("ruleset=Ⓜ️ 微软")]
          if not pri_idx:
              print("::error::缺少 AI 优先关键字规则集 %s —— openai/chatgpt 会被微软规则抢先" % AI_PRIORITY)
              sys.exit(1)
          if not ms_idx:
              print("::error::找不到 ruleset=Ⓜ️ 微软 开头的行，无法校验插入顺序")
              sys.exit(1)
          if pri_idx[0] > ms_idx[0]:
              print("::error::AI 优先关键字（第 %d 行）排在微软规则集（第 %d 行）之后 —— "
                    "那几个 OpenAI-on-Azure 域会直连真实 IP" % (pri_idx[0] + 1, ms_idx[0] + 1))
              sys.exit(1)

          print("通过：无前瞻、无写死自建节点名；日本节点含机场日本且自建在前；"
                "两个隔离入口就位；AI 优先关键字排在微软规则之前")
          PY

      - name: Validate base
        run: |
          set -euo pipefail
          # base 是交给订阅转换站的模板；它自己必须是合法 YAML，
          # 且不能含 proxies/proxy-groups/rules —— subconverter 要往这三个键里注入内容，
          # 模板里已有同名键会导致注入冲突。
          python - <<'PY'
          import sys, yaml, pathlib
          d = yaml.safe_load(pathlib.Path("base/clash-base.yaml").read_text(encoding="utf-8"))
          bad = [k for k in ("proxies", "proxy-groups", "rules") if k in d]
          if bad:
              sys.exit("::error::base 含 subconverter 要注入的键: %s" % bad)
          if d.get("ipv6") is not False:
              sys.exit("::error::base 的 ipv6 必须显式 false，否则 IPv6 会绕过 TUN")
          dns = d.get("dns") or {}
          if dns.get("enhanced-mode") != "fake-ip":
              sys.exit("::error::base 的 dns.enhanced-mode 必须是 fake-ip")
          if dns.get("respect-rules") is not True:
              sys.exit("::error::base 必须开 dns.respect-rules")
          if not dns.get("proxy-server-nameserver"):
              sys.exit("::error::respect-rules 下缺 proxy-server-nameserver 会让 mihomo 起不来")
          for s in dns.get("fallback") or []:
              if not str(s).startswith("https://"):
                  sys.exit("::error::fallback 只允许加密 DoH，发现: %s" % s)
          print("base 校验通过：ipv6=false, fake-ip, respect-rules, fallback 全为 DoH")
          PY

      - name: Check upstream rulesets
        run: |
          set -euo pipefail
          # 这一步有两个作用，缺一不可：
          #   1) 不能让不可达的规则集静默通过 —— 上游 404 会让订阅转换少一批规则，
          #      而用户可能几个月都发现不了。
          #   2) 它每次都重写 STATUS.md，从而【每天都有一次提交】。
          #      GitHub 会在仓库连续 60 天没有提交后自动禁用定时工作流，
          #      而本仓库的 ini 全是远程引用、上游改了它常常不变 ——
          #      没有这个心跳，定时任务会在某一天悄悄死掉。
          python check.py || true
          if grep -q '不可达' STATUS.md && ! grep -q '不可达 | \*\*0\*\*' STATUS.md; then
            echo "::warning::有规则集不可达，详见 STATUS.md"
          fi

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME:-main}"

          # ── 提交的是【生成物】，所以以远端 tip 为基准，只放上我们自己的产物 ───
          # 旧写法是 `fetch + merge -X ours + push`，实测它会【静默卡死】：
          #   merge 一旦失败，`|| git merge --abort` 把状态退回原样，
          #   于是每次 push 都是 non-fast-forward —— 三次重试输出完全一样的三行
          #   rejected，而 merge 的错误正好被 `>/dev/null 2>&1` 吞掉，
          #   日志里根本看不出原因。这个坑让 CI 红了三次，每次都像真故障。
          #
          # 生成物本来就不需要合并语义：reset --mixed 让 HEAD 与 index 跟随远端、
          # 工作区保留刚生成的内容，再 git add 我们自己的产物。这样这次提交必然
          # 接在远端之后 => push 一定是 fast-forward；也不会把远端删掉的文件复活
          #（因为 index 以远端为准，只有我们 add 的文件进这次提交）。
          for attempt in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset --mixed --quiet FETCH_HEAD
            git add ACL4SSR_Online_Full_ClaudeAI_MultiMode.ini STATUS.md
            if git diff --cached --quiet; then
              echo "产物与远端一致，无需提交"
              exit 0
            fi
            git commit -m "chore: 重新生成订阅配置 + 上游巡检（$(date -u +%Y-%m-%d)）"
            if git push; then
              echo "推送成功（第 $attempt 次尝试）"
              exit 0
            fi
            echo "推送未成功，第 $attempt/3 次，5 秒后重试"
            sleep 5
          done
          echo "::error::三次推送均失败"
          exit 1
