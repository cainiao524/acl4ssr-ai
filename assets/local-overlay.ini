; =============================================================================
;  local-overlay.ini —— 本地覆盖层（单一事实源）
; -----------------------------------------------------------------------------
;  由 assets/overlay_merge.py 合并到远程 ACL4SSR ini 之上，合并结果再交给
;  assets/acl4ssr_build.py 解析 → 生成 /etc/sing-box/subscribe/acl4ssr-game.yaml
;
;  【要改 AI 走哪个节点，只改下面 `(日本|JP|Japan)` 这一处正则。】
;
;  覆盖层语义（见 overlay_merge.py 的文档头）：
;     custom_proxy_group=NAME`...  → 替换底里同名组；底里没有则新增
;     rules=...                    → 追加；本管线里 rules= 天然排在所有 ruleset 之前
;     ; 或 # 开头                   → 注释（logical_lines 会丢弃，不影响统计）
; =============================================================================


; =============================================================================
;  1) 「💬 Ai平台」策略组 —— 从「会漂移」改成「钉死」
; =============================================================================
;
;  上游原版（危险）：
;      custom_proxy_group=💬 Ai平台`select`[]🚀 节点选择`[]♻️ 自动选择`[]...`[]DIRECT
;
;  两个问题：
;    (a) 默认链路是  💬 Ai平台 → 🚀 节点选择 → ♻️ 自动选择(url-test)
;        —— 出口会在 url-test 健康检查里变化。对 Claude / GPT 账号，
;        IP 漂移是头号封号信号（远比"IP 本身好不好"更容易触发风控）。
;    (b) 组里挂着 []DIRECT —— 节点全部不可用时，AI 流量会【静默走真实 IP】，
;        而你在客户端界面里看不出任何异常。
;
;  修正：
;    * 组内只留一个子组「🔒 AI专用」—— 选无可选，出口恒定。
;    * 不给 DIRECT —— 节点全挂时请求直接失败（fail closed），
;      宁可断网让你立刻发现，也不要静默暴露真实 IP 给 Anthropic。
custom_proxy_group=💬 Ai平台`select`[]🔒 AI专用


; =============================================================================
;  2) 「🔒 AI专用」子组 —— 按节点名正则过滤
; =============================================================================
;
;  ⚠️⚠️ 这个正则【必须】命中你打算用于 AI 账号的节点名 ⚠️⚠️
;
;  当前订阅里的真实节点名（来自 /etc/sing-box/subscribe/proxies）：
;      🇯🇵 日本 xtls-reality
;      🇯🇵 日本 hysteria2
;
;  (日本|JP|Japan) 会同时命中这两个。它们是【同一台机器的两个协议】，
;  出口 IP 完全相同 —— 所以组内无论怎么选，都不会造成 IP 漂移。
;
;  ❗ 如果将来你的订阅里混入了多台机器的节点，这个正则就会把别的机器
;     也拉进 AI 组 —— 那时 AI 出口就可能漂到别的 IP。届时请：
;       ① 用 scripts/rename-node.sh 给 AI 专用节点改名加可识别标识，例如
;            🇯🇵 日本 xtls-reality [AI]
;          然后把这个正则改成   [[]AI[]]
;          （`[[]` 是刻意的：acl4ssr_build.py 的 normalize_filter_pattern
;            会把 `\(`/`[(` 收敛成字符类，避免 YAML 双引号标量把 `\(` 吃掉）
;       ② 或直接在这里写死节点全名，例如
;            (xtls-reality|hysteria2)
;          但注意这会把【所有机器】的这两种协议都拉进来，通常不是你要的。
;
;  另：过滤器一个节点都匹配不到时，acl4ssr_build.py 会把该组留成空组
;  （不兜底并入全部节点 —— 那会让"日本节点"组里塞满美国节点）。
;  空组会导致 AI 流量直接失败。gen-acl4ssr.sh 的第 5/5 步有一条硬断言
;  专门拦这个：匹配不到节点就 FAIL，不会生成一份"看着正常但 AI 全挂"的配置。
custom_proxy_group=🔒 AI专用`select`(日本|JP|Japan)


; =============================================================================
;  3) AI 规则补充
; =============================================================================
;
;  上游 💬 Ai平台 引用两个 ACL4SSR 官方规则集：
;      Ruleset/AI.list     47 条 —— anthropic.com / claude.ai / claude.com /
;                                    claudeusercontent.com / openai.com /
;                                    chatgpt.com / auth0.com / identrust.com /
;                                    events.statsigapi.net / featuregates.org /
;                                    intercom.io / client-api.arkoselabs.com
;                                    + DOMAIN-KEYWORD claude,anthropic,openai
;                                    + Gemini / Copilot / Cursor / Mistral /
;                                    Perplexity / x.ai / Meta AI / Sora /
;                                    JetBrains AI / Groq / NotebookLM
;      Ruleset/OpenAi.list 17 条 —— 补充 challenges.cloudflare.com / stripe.com /
;                                    sentry.io 等前端依赖
;
;  也就是说：OpenAI 侧覆盖得相当全，Claude 侧靠 DOMAIN-KEYWORD,claude 兜底。
;
;  ── 补强：融合 VPSDance/ai-proxy-rules + xiaolai/anthropic-claude-surge-rules-set ──
;
;  【主】https://github.com/VPSDance/ai-proxy-rules        （MIT，★490，每日自动同步）
;
;    它是【聚合器】而不是单一规则集：整合 v2fly、blackmatrix7、xiaolai、net-coffee
;    等多源，合并去重后再按 provider 精修。STATUS.md 里逐条列出每个 provider 的
;    数据来源与抓取日期 —— 这一点比"某个人的手写清单"可信得多。
;
;    以 Claude 为例，它把 xiaolai 的 13 条扩到 50 条，补出来的是：
;        anthropic.com.cn / antspace.dev / anthropic.team / chatbotclaude.com
;        claude.app / claude.new / claude.site / claude.dev
;        claudemcpclient.com / claudemcpcontent.com / claudepages.dev / claudestudio.com
;        modelcontextprotocol.com / .net / .org      （xiaolai 只有 .io）
;        anthropic-com.ghost.io / anthropic.auth0.com
;        anthropic.com.cdn.cloudflare.net / servd-anthropic-website.b-cdn.net
;        browser-intake-us5-datadoghq.com / intercom.io / intercomcdn.com / sentry.io
;        DOMAIN-KEYWORD,datadog|sentry|sift
;        PROCESS-NAME,Claude|Claude.exe|claude|claude.exe|cowork-svc.exe
;        IP-ASN,399358,no-resolve                     ← 比 IP-CIDR 更全的兜底
;
;    ⚠️ 注意它内置了 PROCESS-NAME 进程规则 —— 这正是本覆盖层第 6 节手工加的那批。
;       两者重复会被去重（多出几条 duplicate_rules，无害）；也可以把第 6 节删掉。
;       【刻意保留第 6 节】：它用的是大小写不敏感的 REGEX + PATH 兜底，
;       聚合器用的是精确匹配（Claude / Claude.exe / claude / claude.exe 四种写法枚举）。
;       两种写法互补，且进程规则本身是"域名清单滞后"的保险，多重一层不亏。
;
;  【备】https://github.com/xiaolai/anthropic-claude-surge-rules-set
;    已被上面那个仓库吸收（STATUS.md 的 Anthropic 条目里写着 "xiaolai, fetched ..."）。
;    所以【不再单独引用它】—— 引了也只是多出十几条 duplicate_rules。
;    保留本段说明是为了让后来者知道这条线为什么不在配置里。
;
;    ⚠️ 格式选择很关键：这两个仓库的 Clash 产物有两种风格 ——
;      * rule-provider 风格（`+.claude.ai`）：本管线的 normalize_rule 只认
;        `TYPE,VALUE[,modifier]`，那种写法会被整行丢弃（fields<2）。
;      * classical 风格（`DOMAIN-SUFFIX,claude.ai`）：正是我们要的。
;    ai-proxy-rules 的 rules/clash/*.yaml 是 classical（README 自己也写
;    "Clash / Mihomo 通过 rule-provider 引用时，请设置 behavior: classical"），
;    实测 50 条零丢弃；Surge 格式的 rules/surge/*.list 同样可用。
;
;    ⚠️⚠️ 为什么必须用 ruleset_anchor 而不是直接写 ruleset=：
;
;    底 ini 里「🚀 节点选择」引用的 ProxyGFWlist.list 有 7000+ 条，其中就包含
;        DOMAIN-SUFFIX,anthropic.com
;        DOMAIN-SUFFIX,claude.ai
;        DOMAIN-SUFFIX,chatgpt.com
;        DOMAIN-SUFFIX,openai.com
;    规则是先匹配者胜。如果把下面这些行简单追加到文件末尾，它们会排在 GFWlist
;    之后 —— 于是 claude.ai 先被 GFWlist 命中，走「🚀 节点选择」（会随 url-test
;    漂移，也可能是任何一台机器），而「💬 Ai平台」那套钉死规则永远轮不到。
;
;    这正是最隐蔽的一类失效：配置能加载、AI 能正常用、分流看着也正常，
;    但账号出口根本不是你以为的那台。
;
;    ruleset_anchor 让这些行插到底 ini 里【最后一个 `ruleset=💬 Ai平台,` 之后】，
;    也就是紧挨着 AI.list / OpenAi.list —— 那一组位于 ProxyGFWlist 与 ChinaDomain
;    之前，顺序才是对的。锚点找不到时会退回插到最前（并记进 report），
;    绝不放任它落到末尾。
;
;    ℹ️ 这两个规则集里的 `DOMAIN,storage.googleapis.com` 是 Google Cloud Storage
;    的通用域名（Claude 用它分发更新）。它会把【其他服务的 GCS 流量】也一并拉到
;    「💬 Ai平台」（= lisahost 日本节点）。代价只是那些流量绕路，不是安全问题。
;
;    ℹ️ 为什么不直接用 ai-proxy-rules 的 `global`（339 条）或 `coding`（249 条）
;    一套搞定：那会把 Gemini / Grok / Meta AI / HuggingFace / Ollama 等【所有】
;    AI 服务都拉进「💬 Ai平台」。本机的 AI 组是"钉死单节点"的账号专用组，
;    塞进几十种服务只会让这个组越来越难解释。ACL4SSR 的 AI.list（47 条）
;    已经在组里覆盖了那些品牌，粒度刚好。所以这里只补 Claude 与 ChatGPT 两个
;    【真有账号】的 provider —— 各取它最深的 50 / 52 条。
ruleset_anchor=💬 Ai平台
ruleset=💬 Ai平台,https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/clash/anthropic.yaml
ruleset=💬 Ai平台,https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/clash/openai.yaml



; =============================================================================
;  3.5) 「🎮 游戏下载」「🎮 游戏平台」默认出口改成 DIRECT
; =============================================================================
;
;  上游底板这两个组的第一个成员都是「🚀 节点选择」——
;  而 select 组的第一项就是默认选中项，于是【默认状态下游戏下载全部走代理】。
;  实测（mihomo 用真实产物跑）：
;      cache1.steamcontent.com      → 🎮 游戏下载 → 🚀 节点选择 → 🇯🇵 日本节点
;      dl.steam.clngaa.com          → 同上
;      steampipe-partner.akamaized.net → 同上
;  这几条 CDN 里既有国内加速节点（clngaa / ksyna / steamchina / pinyuncloud），
;  也有境外 Akamai。底板把它们放进「游戏下载」并对齐到 DIRECT，正是因为
;  【直连比绕日本再回来快得多】—— 走代理不但慢，还把几十 GB 的下载计进 VPS 流量。
;
;  所以把 DIRECT 提到第一位（与同门仓库 cainiao524/acl4ssr-ai 的写法一致）。
;  需要走代理时仍可在客户端里手动切到任意节点 —— 只是不再是默认。
custom_proxy_group=🎮 游戏下载`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换

;  「游戏平台」= 联机/登录/CDN 混杂（Steam/Epic/Xbox/PS/Nintendo/暴雪…）。
;  上游底板同样以「🚀 节点选择」为默认。这里也把 DIRECT 提到第一位：
;  其中大量是【国内】节点（wmsj.cn / battlenet.com.cn / myqcloud / 各类国内 CDN），
;  走代理纯属绕路。联机质量若因直连变差，可在客户端里手动切回节点。
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]🇺🇲 美国节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🚀 手动切换

;  ℹ️ 「🎮 Steam 商店/社区」保持走节点（不改）：商店/社区在国内常被墙，
;     直连打不开。它和「下载」是两回事，这也是底板分两个组的原因。


; =============================================================================
;  4) Steam 三分流：把「登录」从「商店/社区」里拆出来
; =============================================================================
;
;  上游的 Steam 分流是两分（都在 ini 的 ruleset 里，已随管线存在）：
;      🎮 游戏下载         默认 DIRECT —— 76 条 CDN，含 dl.steam.clngaa.com
;                                        等国内节点，直连比走代理快得多
;      🎮 Steam 商店/社区   默认 🚀 节点选择 —— 28 条，含 steampowered.com /
;                                        steamcommunity.com / steamstatic.com
;      🎮 游戏平台         默认 DIRECT —— Steam / Epic / Xbox / PS / Nintendo …
;
;  「商店/社区」的 DOMAIN-SUFFIX,steampowered.com 把登录接口也一起吞了。
;  但它俩的诉求不同：
;      浏览商店/社区  —— 只要能看到就行，用哪个节点无所谓
;      登录/购买/账号 —— 涉及账号状态，应该走【固定出口】
;
;  所以拆出第三组。下面四条是 rules= 内联，天然排在 GameSteamWeb.list 的
;  DOMAIN-SUFFIX,steampowered.com 之前，所以能先命中。
;
;  默认走 🔒 AI专用（固定日本节点），保留 []DIRECT 作为可选项：
;  login.steampowered.com 在国内多数线路并不被墙，直连 = 国区 IP =
;  和账号地区一致，反而更安全。用户可以按自己网络情况在客户端里切。
custom_proxy_group=🔑 Steam 登录`select`[]🔒 AI专用`[]DIRECT

rules=DOMAIN,login.steampowered.com,🔑 Steam 登录
rules=DOMAIN,api.steampowered.com,🔑 Steam 登录
rules=DOMAIN,checkout.steampowered.com,🔑 Steam 登录
rules=DOMAIN,help.steampowered.com,🔑 Steam 登录


; =============================================================================
;  5) 安全加固：拆掉两处「会泄漏真实 IP / 会漂移」的默认链路
; =============================================================================
;
;  ── 5.1 「🐟 漏网之鱼」里的 []DIRECT ────────────────────────────────────────
;
;  上游原版：
;      custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`[]...
;
;  「漏网之鱼」是 MATCH 兜底 —— 所有没被前面规则命中的流量都落在这里。
;  它的成员列表里挂着 DIRECT：用户在客户端里误点一下，【全机未匹配流量全部直连】，
;  而界面上完全看不出区别。
;
;  去掉 DIRECT = 一个真正的 kill switch：
;     * 节点全挂时未匹配流量【直接失败】，你会立刻发现；
;     * 而不是静默走真实 IP，等你几天后从别的地方发现账号裸奔过。
;  保留 []🚀 手动切换，需要直连时仍可在别处显式选择，但不会作为兜底误触。
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇯🇵 日本节点`[]🚀 手动切换
;
;  ── 5.2 「🚀 节点选择」把 url-test 从默认位挪走 ─────────────────────────────
;
;  上游原版：
;      custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]...
;
;  它是一个 select 组，而【第一项就是 url-test 的「♻️ 自动选择」】——
;  select 组的第一项就是默认选中项，于是默认链路上凭空多了一层测速漂移：
;
;      🐟 漏网之鱼 → 🚀 节点选择 → ♻️ 自动选择(url-test) → 节点随健康检查变化
;
;  对本机当前只有「同一台机器的 reality + hysteria2」的情况，出口 IP 相同、
;  实际不会漂；但只要日后订阅里混入第二台机器，未匹配流量的出口就会开始漂。
;
;  把固定地区组提到第一位：默认链路里不再有 url-test，
;  而「♻️ 自动选择」仍留在列表里作为可选项（想按延迟自动挑时手动选）。
custom_proxy_group=🚀 节点选择`select`[]🇯🇵 日本节点`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🇸🇬 狮城节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]🚀 手动切换`[]DIRECT
;
;  ℹ️ 关于「6 个空地区组被兜底 DIRECT」这个问题 —— 它不在覆盖层里改，
;     而是改了编译器 acl4ssr_build.py：空组占位从 DIRECT 改为
;     【第一个真实节点】，一个节点都没有时才退回 REJECT
;     （见 pick_empty_placeholder()）。
;
;     原因：那些组（🇭🇰香港 / 🇨🇳台湾 / 🇸🇬狮城 / 🇺🇲美国 / 🇰🇷韩国 / 🎥奈飞节点）
;     是【地区语义】的组，塞 DIRECT 等于「没有香港节点就用你家宽带」——
;     概念错误且静默泄漏。降级到真实节点则既不泄漏也仍可用。
;
;     ⚠️ 占位刻意不用「🚀 节点选择」：第一版这么写，mihomo -t 直接报
;        loop is detected in ProxyGroup（因为「🚀 节点选择」自己引用了这些地区组，
;        占位就把环接上了）。静态自检 33 项全 PASS，是 mihomo -t 抓到的 ——
;        这就是为什么静态自检不能替代权威校验。


; =============================================================================
;  6) AI 客户端进程规则 —— 域名规则之外的第二层保险
; =============================================================================
;
;  ── 为什么需要第二层 ──────────────────────────────────────────────────────
;
;  前面那套全是【域名】规则（xiaolai + ACL4SSR 的 AI.list / OpenAi.list）。
;  域名清单永远可能滞后：Anthropic 新增一个遥测域名、桌面端换一个 CDN，
;  你的 AI 流量就会从「💬 Ai平台」漏到「🐟 漏网之鱼」，再跟「🚀 节点选择」走
;  —— 而「🚀 节点选择」可能停在任意一台机器上（你截图里就停在云悠①）。
;
;  进程规则按【发起连接的程序】匹配，与目标域名无关，正好补这个缺口：
;  只要 Claude 桌面端在跑，它的流量一定走「💬 Ai平台」，不管对面是什么域名。
;
;  ── 为什么用 -REGEX + (?i) 而不是直接 PROCESS-NAME ─────────────────────────
;
;  mihomo 的 PROCESS-NAME 是【精确匹配 + 大小写敏感】。官方文档里那个
;  忽略大小写的例子写的正是：
;      PROCESS-NAME-REGEX,(?i)Telegram,PROXY
;  Windows 上进程名的实际大小写（Claude.exe / claude.exe）不由我们决定，
;  所以统一用 (?i) 前缀。
;
;  ── 为什么正则里【刻意不含反斜杠】 ─────────────────────────────────────────
;
;  rules= 行会被 acl4ssr_build.py 的 parse_rules_line 按逗号切分，产物再经
;  YAML 双引号标量转义。写 `\.exe$` 要穿过两层转义，是自找麻烦；而
;  `(?i)claude` 这种"进程名里含 claude"的写法语义已经够用、零转义歧义。
;
;  ── 这些行会排在哪里 ───────────────────────────────────────────────────────
;
;  rules= 是内联规则，本管线里【天然排在所有 ruleset 之前】（见
;  acl4ssr_build.py collect_rules 的第 1) 段）。所以进程规则比任何域名规则
;  都先命中 —— 优先级最高，不会被 ProxyGFWlist 之类抢走。
;
;  ── ⚠️ 两个前提（不满足则规则静默失效，产物看不出问题） ────────────────────
;
;    1) find-process-mode 默认是 strict —— 配置里出现 PROCESS-* 规则时
;       会自动启用进程查找，无需额外设置。若被设成 off，这些行形同虚设。
;    2) Windows 上读进程信息需要权限：客户端要以【管理员】运行 + TUN 模式。
;       否则匹配不到，同样静默失效 —— 这是本方案唯一的软肋，值得记在心里。

; Claude 桌面端 / Claude Code（native 版可执行文件名都含 claude）
rules=PROCESS-NAME-REGEX,(?i)claude,💬 Ai平台
; 再用【进程路径】兜一层：Claude Code 早期版本跑在 node.exe 里，
; 进程名是 node.exe（不能直接匹配，会误伤所有 Node 程序），
; 但它的安装/数据路径里带 claude —— 路径正则就能精确命中。
rules=PROCESS-PATH-REGEX,(?i)claude,💬 Ai平台

; ChatGPT 桌面端
rules=PROCESS-NAME-REGEX,(?i)chatgpt,💬 Ai平台
rules=PROCESS-PATH-REGEX,(?i)chatgpt,💬 Ai平台

; 其他 AI 客户端 —— 不用就删掉这两行（路径正则已经覆盖了目录名含这些字样的安装）
rules=PROCESS-NAME-REGEX,(?i)cursor,💬 Ai平台
rules=PROCESS-NAME-REGEX,(?i)windsurf,💬 Ai平台
