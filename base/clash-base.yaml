      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "+.openai.com":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "+.chatgpt.com":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "+.oaistatic.com":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "+.oaiusercontent.com":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "browser-intake-us5-datadoghq.com":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "cdn.usefathom.com":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "servd-anthropic-website.b-cdn.net":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "anthropic.com.cdn.cloudflare.net":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"
    "anthropic-com.ghost.io":
      - "https://1.1.1.1/dns-query#💬 Ai平台"
      - "https://8.8.8.8/dns-query#💬 Ai平台"

  # respect-rules 打开时【必须】有 proxy-server-nameserver，否则 mihomo 起不来
  proxy-server-nameserver:
    - "https://doh.pub/dns-query"

  # ⚠️ fallback 只用境外【加密 DoH】。绝不可写成 tls://8.8.4.4 这类直连 DoT：
  #    respect-rules 为 false 时它们不走代理、从物理网卡直连，国内必然被墙，
  #    命中 fallback 的域名每次新建连接都要干等约 5 秒；同时把
  #    「本机正向境外 DNS 发加密查询」这一元数据暴露给本地 ISP。
  fallback:
    - "https://1.1.1.1/dns-query#🚀 节点选择"
    - "https://8.8.8.8/dns-query#🚀 节点选择"
  fallback-filter:
    geoip: true
    geoip-code: CN
